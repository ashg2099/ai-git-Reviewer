[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gitreviewer"
version = "1.0.0"
description = "Hybrid structural & semantic code auditor powered by Llama-3 via Groq"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
  { name = "Ashwin", email = "ashg2099@outlook.com" }
]
keywords = ["code-review", "ai", "git", "static-analysis", "llm", "codebert", "groq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
]

# Derived from your requirements.txt
dependencies = [
    "typer[all]==0.9.0",
    "python-dotenv==1.0.0",
    "markdown==3.5.0",
    "groq>=0.9.0",
    "torch>=2.0.0",
    "transformers>=4.41.0,<5.0.0",
    "sentence-transformers>=3.0.0",
    "requests>=2.31.0",
    "pandas",
    "scikit-learn",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "pytest-cov==4.1.0",
]

[project.scripts]
# This creates a global 'ai-review' command
ai-review = "ai_gitreviewer.cli:app"

[tool.setuptools.packages.find]
# Tells the build system where your code lives
where = ["src"]

[tool.pytest.ini_options]
# Integrates pytest.ini directly into pyproject.toml
minversion = "7.0"
addopts = "-ra -q --cov=src"
testpaths = ["tests"]
pythonpath = ["src"]

[project.urls]
Homepage = "https://github.com/ashg2099/ai-git-Reviewer"
Repository = "https://github.com/ashg2099/ai-git-Reviewer"
"Bug Tracker" = "https://github.com/ashg2099/ai-git-Reviewer/issues"